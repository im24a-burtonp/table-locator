<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kiosk">
        <div class="kiosk-content">
            <img class="logo"
                src="assets/logo.svg"
                alt="Firehouse logo"
                height="130px" />

            <p>
                SCHNAPP DIR EINEN <br>
                TISCHAUFSTELLER VON <br>
                DER SEITE UND TRAGE <br>
                DIE NUMMER HIER EIN <br>
            </p>

            <div class="input-wrapper">
                <div class="locator-display" id="locator-display">
                </div>

                <div class="keypad">
                    <div class="number"><button>1</button></div>
                    <div class="number"><button>2</button></div>
                    <div class="number"><button>3</button></div>
                    <div class="number"><button>4</button></div>
                    <div class="number"><button>5</button></div>
                    <div class="number"><button>6</button></div>
                    <div class="number"><button>7</button></div>
                    <div class="number"><button>8</button></div>
                    <div class="number"><button>9</button></div>
                </div>
                <div class="bottom-row">
                    <div class="number"><button>0</button></div>
                    <div class="clear"><button>CLEAR</button></div>
                </div>
            </div>
            <button class="submit">BESTÄTIGEN</button>
        </div>
    </div>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.166.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/" } } </script>
    <script type="module" src="app.js"></script>
</body>
</html>
